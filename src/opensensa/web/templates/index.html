<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenSensa — Agent Chat</title>

    <!-- Scoped styles (all selectors under .root) -->
    <link rel="stylesheet" href="/web/static/styles.css" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />

    <!-- CDN deps — passed to mount() so the module stays dependency-free -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        /* Full-viewport wrapper for the standalone page */
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #app {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="app"></div>

    <script type="module">
        import mount from "/web/static/app.js";

        const { destroy } = mount(document.getElementById("app"), {
            // baseUrl: "",          // set if the API lives elsewhere
            // storagePrefix: "opensensa",
            // marked: window.marked,
            // hljs: window.hljs,
        });

        // expose destroy() globally in case you need to unmount from DevTools
        window.__opensensaDestroy = destroy;
    </script>
</body>

</html>
