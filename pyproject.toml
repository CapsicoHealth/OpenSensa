[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opensensa"
version = "0.1.0"
description = "A CLI framework for building AI agents with A2A protocol and MCP tools"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    { name = "CapsicoHealth Inc. Team" },
]
keywords = ["ai", "agents", "a2a", "mcp", "llm", "cli", "capsico", "capsicohealth", "healthcare"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastmcp>=2.13.1",
    "mcp[cli]>=1.14.1",
    "openai>=1.0.0",
    "openai-agents>=0.0.7",
    "a2a-sdk>=0.3.0",
    "httpx>=0.28.1",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0",
    "fastapi>=0.115.0",
    "python-frontmatter>=1.1.0",
    "uuid7>=0.1.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
opensensa = "opensensa.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/opensensa"]

[tool.hatch.build.targets.wheel.force-include]
"src/opensensa/web/static" = "opensensa/web/static"
"src/opensensa/web/templates" = "opensensa/web/templates"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
