# OpenSensa Configuration
# Copy this to opensensa.yaml and customize for your project.

models:
  # The default model used when an agent specifies model: ${default} or omits model
  default: my-model
  registry:
    my-model:
      base_url: https://api.openai.com/v1   # Any OpenAI-compatible endpoint
      api_key: ${OPENAI_API_KEY}             # Environment variable interpolation
      model_name: gpt-4.1-mini
    # Example: local Ollama
    # local-llama:
    #   base_url: http://localhost:11434/v1
    #   api_key: none
    #   model_name: llama3.3

server:
  host: 0.0.0.0
  orchestrator_port: 8000   # A2A agent server
  mcp_port: 8001            # MCP tool server

agents:
  directory: ./agents/       # Where agent .md files live

tools:
  directory: ./tools/        # Where tool .py files live
  builtin: true              # Include bundled example tools

# Remote A2A agents to discover
# remote_agents:
#   - url: https://researcher-service.example.com
#   - url: http://localhost:9001

logging:
  level: info                # debug, info, warning, error
  # file: ./logs/opensensa.jsonl  # Optional: structured JSON log file
